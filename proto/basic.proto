syntax = "proto3";

package ctrlaltdefeat;

// ── RPCs ──────────────────────────────────────────────────────────────────

service Lobby {
  rpc CreateGame (CreateGameRequest) returns (GameState);
  rpc JoinGame   (JoinRequest)       returns (JoinResponse);
  rpc StartGame  (StartRequest)      returns (GameState);

  // Streaming — server pushes updates to all watchers
  rpc WatchGame  (WatchRequest)      returns (stream GameState);
}

service Game {
  // Gameplay
  rpc GetState   (StateRequest)      returns (GameState);
  rpc PlayTurn   (TurnRequest)       returns (TurnResult);
  rpc DiscardCard(DiscardRequest)    returns (GameState);
  rpc SkipTurn   (SkipRequest)       returns (GameState);

  rpc DrawCards  (DrawRequest)        returns (DrawResult);
  rpc LeaveGame  (LeaveRequest)       returns (GameState);

  // Resolve a pending discard — see Player.pending_discard.
  rpc ResolveDiscard (ResolveDiscardRequest) returns (DrawResult);
}

// ── Request / Response messages ───────────────────────────────────────────

message CreateGameRequest {}

message JoinRequest {
  string game_id     = 1;
  string player_name = 2;
}

message JoinResponse {
  string    player_id = 1;
  GameState state     = 2;
}

message StartRequest {
  string game_id = 1;
}

message StateRequest {
  string game_id = 1;
}

message TurnRequest {
  string         game_id          = 1;
  string         player_id        = 2;
  int32          objective_index  = 3;
  repeated int32 action_indices   = 4;
}

message TurnResult {
  bool      success        = 1;
  int32     spaces_moved   = 2;
  bool      bonus          = 3;
  bool      lose_turn      = 4;
  int32     responsibility = 5;
  int32     effect         = 6;
  GameState new_state      = 7;
  // Glitch Cards resolved from the bonus draw (responsibility >= 4). See
  // GlitchEvent and Player.pending_discard.
  repeated GlitchEvent glitch_events = 8;
}

// One resolved Glitch Card: what it was and what happened when it was
// played. drawn_card_names is only populated for a "draw" effect_type.
message GlitchEvent {
  string         name              = 1;
  string         description       = 2;
  string         effect_type       = 3;  // "discard" | "draw" | "skip_operation"
  int32          count             = 4;
  string         target_category   = 5;  // empty if not category-restricted
  repeated string drawn_card_names = 6;
}

// A discard the player owes — from a Glitch Card's discard effect or from
// exceeding the hand limit — waiting on them to choose which card(s) to
// discard. Presence on Player (proto3 message-field presence) means
// there's a pending choice to resolve via ResolveDiscard.
message PendingDiscard {
  int32  count           = 1;
  string target_category = 2;  // empty if not category-restricted
  string reason          = 3;  // "glitch" | "hand_limit"
}

message DrawResult {
  repeated GlitchEvent glitch_events = 1;
  GameState            new_state     = 2;
}

message ResolveDiscardRequest {
  string         game_id      = 1;
  string         player_id    = 2;
  repeated int32 card_indices = 3;
}

message DiscardRequest {
  string game_id    = 1;
  string player_id  = 2;
  int32  card_index = 3;
}

message SkipRequest {
  string game_id   = 1;
  string player_id = 2;
}

message WatchRequest {
  string game_id   = 1;
  string player_id = 2;
}

message DrawRequest {
  string game_id   = 1;
  string player_id = 2;
}

message LeaveRequest {
  string game_id   = 1;
  string player_id = 2;
}

// ── State messages ────────────────────────────────────────────────────────

message GameState {
  string          game_id           = 1;
  string          status            = 2;
  repeated Player players           = 3;
  string          current_player_id = 4;
  string          winner_id         = 5;
}

message Player {
  string id             = 1;
  string name           = 2;
  int32  board_position = 3;
  bool   lose_next_turn = 4;
  Hand   hand           = 5;
  PendingDiscard pending_discard = 6;
}

message Hand {
  repeated NonObjectiveCard non_objective_cards = 1;
  repeated ObjectiveCard    objective_cards      = 2;
}

// A card drawn from the action/non-objective deck: either an ActionCard
// or a GlitchCard, mirroring cards.py's class split.
message NonObjectiveCard {
  string name        = 1;
  string description = 2;

  oneof card {
    ActionCard action = 3;
    GlitchCard glitch = 4;
  }
}

message ActionCard {
  string category       = 1;
  int32  responsibility = 2;
  int32  effect         = 3;
}

message GlitchCard {
  string glitch_type      = 1;  // original free-text description
  string effect_type      = 2;  // "discard" | "draw" | "skip_operation"
  string target_category  = 3;  // empty if not category-restricted
  int32  count            = 4;
}

message ObjectiveCard {
  string name           = 1;
  string description    = 2;
  int32  responsibility = 3;
  int32  effect         = 4;
}